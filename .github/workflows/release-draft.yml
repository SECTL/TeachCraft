name: Cross-Platform Matrix Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.memory/**'
      - 'docs/**'
      - 'design-preview/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: |
          dotnet test tests/GradeStrip.Tests/GradeStrip.Tests.csproj --configuration Release --verbosity normal
          dotnet test tests/TeachCraft.Tests/TeachCraft.Tests.csproj --configuration Release --verbosity normal
          dotnet test tests/GradeWeave.Tests/GradeWeave.Tests.csproj --configuration Release --verbosity normal

  build-matrix:
    name: Build (${{ matrix.rid }} · ${{ matrix.deployment }})
    needs: test
    runs-on: ${{ startsWith(matrix.rid, 'osx-') && 'macos-latest' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # linux-arm (32 位) 不参与：QuestPDF 没有该架构的原生库
        rid:
          - win-x86
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
          - linux-x64
          - linux-arm64
        deployment:
          - self-contained
          - framework-dependent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare Version & Deployment
        shell: pwsh
        run: |
          ./scripts/version.ps1
          if ("${{ matrix.deployment }}" -eq "self-contained") {
            $sc = "true"
            $modeLabel = "sc"
          } else {
            $sc = "false"
            $modeLabel = "fdd"
          }
          echo "SELF_CONTAINED=$sc" >> $env:GITHUB_ENV
          echo "MODE_LABEL=$modeLabel" >> $env:GITHUB_ENV
          echo "RID=${{ matrix.rid }}" >> $env:GITHUB_ENV
          # 可自证的构建身份：形如 {语义版本}.{sc|fdd}.{rid}
          # （Directory.Build.props 已关闭 IncludeSourceRevisionInInformationalVersion，否则会被追加 +<sha>）
          $identity = "$($env:VERSION_TAG.TrimStart('v')).$modeLabel.${{ matrix.rid }}"
          echo "BUILD_IDENTITY=$identity" >> $env:GITHUB_ENV
          Write-Host "Build identity: $identity"

      - name: Publish Windows & Linux Artifact
        if: ${{ !startsWith(matrix.rid, 'osx-') }}
        shell: pwsh
        run: |
          $publishDir = "dist/TeachCraft-${{ matrix.rid }}-${{ env.MODE_LABEL }}"
          dotnet publish src/TeachCraft.App/TeachCraft.App.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained ${{ env.SELF_CONTAINED }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:InformationalVersion="$env:BUILD_IDENTITY" `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem -Path $publishDir -Filter *.pdb -Recurse | Remove-Item -Force

          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          $zipName = "TeachCraft-${{ env.VERSION_TAG }}-${{ matrix.rid }}-${{ env.MODE_LABEL }}.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath "artifacts/$zipName" -Force

      # Inno Setup 在 windows-latest 上不保证预装；缺了会让六个 Setup 包全部产不出来，
      # 而检查更新的「安装包形态自动升级」路径完全依赖这些资产（见 .omo/plans/app-update.md todo 3）。
      - name: Ensure Inno Setup
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "未检测到 ISCC，正在安装 Inno Setup..."
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "Inno Setup 安装失败，Setup 包无法生成"; exit 1 }
          Write-Host "ISCC: $iscc"
          & $iscc /? | Select-Object -First 3

      - name: Build Windows Setup Installer
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          ./build-installer.ps1 `
            -Rid "${{ matrix.rid }}" `
            -Version "${{ env.VERSION_TAG }}" `
            -Deployment "${{ matrix.deployment }}" `
            -SkipPublish

      - name: Build macOS Bundle & DMG
        if: startsWith(matrix.rid, 'osx-')
        run: |
          chmod +x bundle/macos/build-dmg.sh
          ./bundle/macos/build-dmg.sh "${{ matrix.rid }}" "${{ env.VERSION_TAG }}" "${{ matrix.deployment }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}-${{ matrix.deployment }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Aggregate & Publish Release
    needs: build-matrix
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Prepare Version
        shell: pwsh
        run: ./scripts/version.ps1

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      - name: Inspect Assets
        shell: pwsh
        run: |
          Get-ChildItem -Path release-assets -Recurse | Select-Object Name, Length

      # 检查更新需要「下载完整性校验」：客户端必须拿到这份清单并校验哈希，
      # 清单缺失即失败关闭（见 .omo/plans/app-update.md todo 12）。
      # macOS 便携用户的检查更新只能拿到 -mac.zip；
      # 少了它，那群用户在更新时会被判为「暂未提供适合当前安装方式的安装包」。
      - name: Verify macOS Portable Package Present
        shell: pwsh
        run: |
          $macZips = Get-ChildItem -Path release-assets -File -Filter '*-mac.zip'
          if ($macZips.Count -lt 4) {
            Write-Error "发布缺少 macOS 便携包：期望 4 个 *-mac.zip（osx-x64/osx-arm64 × sc/fdd），实际 $($macZips.Count) 个。"
            exit 1
          }
          Write-Host "macOS 便携包：$($macZips.Count) 个"
          $macZips | Select-Object Name, Length

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $sumsFile = "release-assets/TeachCraft-${{ env.VERSION_TAG }}-SHA256SUMS.txt"
          $lines = Get-ChildItem -Path release-assets -File |
            Where-Object { $_.Extension -in '.zip', '.exe', '.dmg' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          if ($lines.Count -eq 0) { Write-Error '未找到任何待发布的资产，无法生成校验清单'; exit 1 }
          $lines | Set-Content -Path $sumsFile -Encoding ascii
          Write-Host "已生成 $sumsFile（$($lines.Count) 个资产）"
          Get-Content $sumsFile

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: 知微 · TeachCraft ${{ env.VERSION_TAG }}
          draft: false
          prerelease: ${{ env.IS_RELEASE != 'true' }}
          files: |
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*SHA256SUMS.txt
          body: |
            ## 知微 · TeachCraft 全矩阵跨平台构建（${{ env.VERSION_TAG }}）

            以「分晓 · GradeStrip」的纸墨设计语言做出的教师工具箱：10 件图片 / PDF 小工具，加上分晓、归位、时序与织序四只常备应用，一个窗口里全部搞定。

            ### 工具清单
            - **分晓 · GradeStrip**：成绩总表 → 个人成绩条，多考对比、学科诊断、学生画像。
            - **归位 · SeatGrid**：导入名单自动识别姓名 / 性别 / 身高 / 视力，自动排座，打印、导出 Excel 与 PNG。
            - **时序 · ClassBlock**：导入课程总表自动识别年级与班级，选中班级生成可直接打印的课程表。
            - **织序 · GradeWeave**：导入年级工作簿，先定教研、走班与会议时段，再自动编排全年级课表并检查冲突；支持插入书法课等临时活动（可只叠加提醒，也可替换整节课程）。
            - **图片处理**：格式转换、尺寸调整、压缩、文字水印。
            - **格式工厂**：PDF ↔ Word、图片合成 PDF、PDF 转图片、PDF 合并、PDF 拆分提取。

            ### 资产包说明
            - **Windows Setup 安装包（`*-Setup.exe`）**：⭐ Windows 用户首选，单文件向导，自动创建桌面与开始菜单快捷方式，默认免提权安装（机房电脑无管理员权限也可安装）。
            - **macOS 原生安装镜像（`*.dmg`）**：⭐ Mac 用户首选，打开后把「知微」拖进 Applications 即可；本地 ad-hoc 签名，开箱即用。
            - **绿色便携包（`*.zip`）**：解压即用，适合 U 盘或机房移动使用；macOS 的便携包文件名带 `-mac` 后缀，解压后得到 `TeachCraft.app`。
            - **独立部署（`sc`）**：内嵌 .NET 运行时，**无需安装 .NET**（推荐）。
            - **依赖框架部署（`fdd`）**：体积更小，需要 [.NET 10.0 Runtime](https://dotnet.microsoft.com/download)。

            | 平台 / 架构 | 独立版（开箱即用） | 依赖框架版（需 .NET 10） |
            | :--- | :--- | :--- |
            | **Windows x64** | `TeachCraft-*-win-x64-sc-Setup.exe` / `.zip` | `...-win-x64-fdd-Setup.exe` / `.zip` |
            | **Windows x86 (32 位)** | `TeachCraft-*-win-x86-sc-Setup.exe` / `.zip` | `...-win-x86-fdd-Setup.exe` / `.zip` |
            | **Windows ARM64** | `TeachCraft-*-win-arm64-sc-Setup.exe` / `.zip` | `...-win-arm64-fdd-Setup.exe` / `.zip` |
            | **macOS ARM64（M1~M4）** | `TeachCraft-*-osx-arm64-sc.dmg` | `...-osx-arm64-fdd.dmg` |
            | **macOS x64（Intel）** | `TeachCraft-*-osx-x64-sc.dmg` | `...-osx-x64-fdd.dmg` |
            | **Linux x64** | `TeachCraft-*-linux-x64-sc.zip` | `...-linux-x64-fdd.zip` |
            | **Linux ARM64** | `TeachCraft-*-linux-arm64-sc.zip` | `...-linux-arm64-fdd.zip` |

            > Linux 32 位 ARM 暂不提供：PDF 排版引擎 QuestPDF 没有该架构的原生库。

            ### 隐私与安全
            - **Local Only**：文件处理全部在本机完成、从不上传；仅「检查更新」会联网读取 GitHub Releases 的版本号（不发送任何本机信息），更新记录与安装包只留在本机。
            - 本仓库的预览版由 `main` 分支自动构建；带 `-preview.` 的版本为预发布版。预览版会保留在 Releases 中，由维护者按需清理。

            ---
            *Commit*: `${{ github.sha }}`
            *Triggered by*: `${{ github.actor }}`
